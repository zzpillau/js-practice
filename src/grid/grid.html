<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="grid.css">
</head>
<body>
  <section class="grid-12">
    <div class="grid-element bg-gray">header</div>
    <div class="grid-element bg-red">aside</div>
    <div class="grid-element bg-blue">main</div>
    <div class="grid-element bg-green">aside</div>
    <div class="grid-element bg-yellow">footer</div>
</section>
<section class="grid-1row">
  <div class="white-space"></div>
</section>
<section class="grid-12">
  <div class="grid-element bg-purple">header</div>
  <div class="grid-element bg-salmon">aside</div>
  <div class="grid-element bg-turq">main</div>
  <div class="grid-element bg-tomato">aside</div>
  <div class="grid-element bg-chicken">footer</div>
</section>
<section class="grid-1row">
  <div class="white-space"></div>
</section>
<section class="grid-12">
  <div class="grid-element bg-purple col-12 row-2">header</div>
  <div class="grid-element bg-salmon col-3 row-7">aside</div>
  <div class="grid-element bg-turq col-7 row-7">main</div>
  <div class="grid-element bg-tomato col-2 row-7">aside</div>
  <div class="grid-element bg-chicken col-12 row-3">footer</div>
</section>
<section class="grid-1row">
  <div class="white-space">named lines</div>
</section>
<section class="grid-12-named">
  <div class="grid-element bg-thistle">header</div>
  <div class="grid-element bg-cadetblue">aside</div>
  <div class="grid-element bg-blueviolet">main</div>
  <div class="grid-element bg-sandybrown">aside</div>
  <div class="grid-element bg-aquamarine">footer</div>
</section>
<section class="grid-1row">
  <div class="white-space"></div>
</section>
<section class="grid-1row">
  <div class="white-space"></div>
</section>
<section class="grid-1row">
  <div class="white-space"></div>
</section>
<section class="grid-1row">
  <div class="white-space">grid-template-areas</div>
</section>
<section class="grid-6">
  <div class="grid-header bg-purple">header</div>
  <div class="grid-asideLeft bg-salmon">aside</div>
  <div class="grid-main bg-turq">main</div>
  <div class="grid-asideRight bg-tomato">aside</div>
  <div class="grid-footer bg-chicken">footer</div>
</section>




</body>
</html>
